name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse origin/main)"

          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release tags must point at the latest origin/main commit."
            echo "::error::Release SHA: $RELEASE_SHA"
            echo "::error::origin/main SHA: $MAIN_SHA"
            exit 1
          fi

          # The Tests workflow runs the complete release gate on Linux and
          # macOS (tests/run.sh --release-gate); it must have passed for
          # exactly this commit.
          TEST_RUN="$(gh run list \
            --workflow Tests \
            --branch main \
            --commit "$RELEASE_SHA" \
            --event push \
            --limit 1 \
            --json status,conclusion,url \
            --jq 'if length == 0 then "" else .[0] | [.status, .conclusion, .url] | @tsv end')"

          if [ -z "$TEST_RUN" ]; then
            echo "::error::No Tests workflow run found for $RELEASE_SHA on main."
            exit 1
          fi

          IFS=$'\t' read -r TEST_STATUS TEST_CONCLUSION TEST_URL <<< "$TEST_RUN"

          if [ "$TEST_STATUS" != "completed" ] || [ "$TEST_CONCLUSION" != "success" ]; then
            echo "::error::Release requires a completed successful Tests workflow on main."
            echo "::error::Tests status: $TEST_STATUS"
            echo "::error::Tests conclusion: $TEST_CONCLUSION"
            echo "::error::Tests URL: $TEST_URL"
            exit 1
          fi

      - name: Verify tag version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          NPM_VERSION="$(node -p "require('./npm/package.json').version")"
          PY_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")"

          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match Cargo.toml version $CARGO_VERSION."
            exit 1
          fi

          if [ "$VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match npm/package.json version $NPM_VERSION."
            exit 1
          fi

          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match python/pyproject.toml version $PY_VERSION."
            exit 1
          fi

          if ! grep -Eq "^## \[?${VERSION//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run release checks
        run: |
          cargo fmt --check
          bash -n ci/package-release.sh
          npm test --prefix npm
          cd npm
          MINIPYTHON_SKIP_INSTALL=1 npm publish --dry-run --access public

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          # Cross-compiled on the arm64 runner; it cannot run there.
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          # musl: one static binary for every Linux distribution, including
          # Alpine. MiniPython has no C dependencies, so it needs only
          # musl-tools. musl's allocator is slower than glibc's; that is the
          # price of the static build.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            native: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --bin mnpy --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.native
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/mnpy"
          test "$("$BIN" --version)" = "mnpy ${GITHUB_REF_NAME#v}"
          test "$("$BIN" -c 'print(1 + 2)')" = "3"
          if "$BIN" -c 'import os' 2>/dev/null; then
            echo "::error::import os must be blocked"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            file "$BIN"
            file "$BIN" | grep -Eq 'static(-pie)? linked|statically linked'
          fi

      - name: Package
        run: bash ci/package-release.sh ${{ matrix.target }} target/${{ matrix.target }}/release/mnpy .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minipython-${{ matrix.target }}
          path: minipython-${{ matrix.target }}.tar.gz

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -mindepth 2 -type f -name "*.tar.gz" -exec mv {} . \;
          test "$(ls *.tar.gz | wc -l)" -eq 4
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm
    # The package downloads the release archives in postinstall, so it is
    # published only after they exist.
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports provenance
        run: |
          npm install -g npm@11
          npm --version

      # Trusted publishing (OIDC): no stored npm token.
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: npm

  # Homebrew: lhwzds/homebrew-tap's scheduled Update Formula workflow checks
  # this repository's latest release every six hours and rewrites
  # Formula/minipython.rb from checksums.txt (homebrew-tap-template/README.md),
  # so no tap token is stored here.
