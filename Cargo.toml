[package]
name = "minipython"
version = "0.1.0"
edition = "2024"
license = "MIT AND PSF-2.0"

[[bin]]
name = "mnpy"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
libc = "0.2"
# libm is MIT-licensed (a pure-Rust port of musl libm); math.erf, erfc,
# gamma and lgamma use it, and so does math.cbrt on Linux (a port of
# CORE-MATH's correctly rounded cbrt, for gnu and musl builds alike, where a
# static musl build would otherwise link musl's own cbrt). macOS uses the
# system cbrt CPython uses.
libm = "0.2"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unic-ucd-name_aliases = "0.9"
unicode-ident = "1.0"
unicode-general-category = "1.1"
unicode-normalization = "0.1"
unicode_names2 = "2.0"
