name = "stdlib-argparse-command-line"
scope = "stdlib-sandbox"
category = "runtime-semantic"
root_cause = "argparse-command-line"
modules = ["argparse"]
priority = "should_fix"
source = '''
import argparse, sys
class Capture:
    def __init__(self):
        self.parts = []
    def write(self, text):
        self.parts.append(text)
parser = argparse.ArgumentParser(prog='tool', description='Process items in a few useful ways.')
parser.add_argument('items', nargs='+', type=int, help='integers to process')
parser.add_argument('--op', choices=['sum', 'max'], default='sum', help='operation (default: %(default)s)')
parser.add_argument('-v', '--verbose', action='store_true')
args = parser.parse_args(['3', '1', '4', '--op', 'max', '-v'])
print(args)
print(parser.format_help())
for argv in [['x'], ['1', '--op', 'avg'], [], ['-h']]:
    out, err = Capture(), Capture()
    saved = sys.stdout, sys.stderr
    sys.stdout, sys.stderr = out, err
    try:
        parser.parse_args(argv)
    except SystemExit as exc:
        code = exc.code
    finally:
        sys.stdout, sys.stderr = saved
    print(argv, code, repr(''.join(out.parts)), repr(''.join(err.parts)))
'''

[[case]]
name = "stdlib-re-text-processing"
scope = "stdlib-sandbox"
category = "runtime-semantic"
root_cause = "re-text-processing"
modules = ["re"]
priority = "should_fix"
source = '''
import re
log = """2026-10-29 12:00:01 INFO  [worker-1] request id=17 took 12ms
2026-10-29 12:00:02 ERROR [worker-2] request id=18 took 950ms
not a log line"""
line = re.compile(r'(?P<date>\d{4}-\d{2}-\d{2}) (?P<time>[\d:]+) (?P<level>[A-Z]+)\s+\[(?P<worker>[\w-]+)\] request id=(?P<id>\d+) took (?P<ms>\d+)ms')
for text in log.splitlines():
    m = line.match(text)
    print(m and (m.group('level'), int(m['ms']), m.span('worker'), m.groupdict()['id']))
print(re.findall(r'(\w+)=(\d+)', log), re.split(r'\s*\n\s*', log)[2])
print(re.sub(r'(?P<n>\d+)ms', lambda m: str(int(m['n']) / 1000) + 's', log).splitlines()[1])
print(re.subn(r'(?i)error|info', '<\\g<0>>', log)[1], re.escape('1.5*x'), re.fullmatch(r'\w+', 'ok'))
try:
    re.compile('(?P<x>a)(?P<x>b)')
except re.error as e:
    print(type(e).__name__, e.msg, e.pos)
print([m.span() for m in re.finditer(r'\b\w', 'ab cd')], re.compile(r'x*').sub('-', 'abc'))
'''

